name: Build Mac App

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build Overdrive.app
        run: ./scripts/build-app.sh

      - name: Package DMG
        run: ./scripts/make-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive
          path: build/Overdrive.dmg
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          TAG="v$VERSION"
          NOTES="Already using Bassline or Overdrive? Open Settings › Updates › Install and Relaunch. New install: download **Overdrive.dmg** below, open it, and drag Overdrive into Applications.

          The first time you open it, macOS may say it can't verify the developer. Open System Settings › Privacy & Security, scroll down, and click **Open Anyway**.

          Built from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`."
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" build/Overdrive.dmg \
            --target "$GITHUB_SHA" \
            --title "Overdrive $VERSION" \
            --notes "$NOTES"
